<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Boomslang</title>
  <!-- Branch -->
  <path d="M24 424 Q 256 372 488 398" fill="none" stroke="#7a4a24" stroke-width="40" stroke-linecap="round"/>
  <path d="M38 414 Q 256 364 474 389" fill="none" stroke="#9c6436" stroke-width="13" stroke-linecap="round"/>
  <path d="M120 404 Q 92 360 58 346" fill="none" stroke="#7a4a24" stroke-width="18" stroke-linecap="round"/>
  <ellipse cx="46" cy="338" rx="30" ry="16" transform="rotate(25 46 338)" fill="#6fbf4a"/>
  <path d="M30 336 Q 46 340 62 340" fill="none" stroke="#4f9a35" stroke-width="3" stroke-linecap="round"/>
  <!-- Tail, tapering along the branch -->
  <path d="M88 386 C 120 370 170 360 214 357 L 214 411 C 170 410 122 402 88 386 Z" fill="#3f9a3c"/>
  <!-- Body -->
  <path d="M206 384 C 300 380 380 378 418 352 C 470 316 450 252 386 256 C 322 260 262 270 258 226"
        fill="none" stroke="#3f9a3c" stroke-width="56" stroke-linecap="round"/>
  <path d="M206 384 C 300 380 380 378 418 352 C 470 316 450 252 386 256 C 322 260 262 270 258 226"
        fill="none" stroke="#c9ea7f" stroke-width="18" stroke-linecap="round" stroke-dasharray="24 12"/>
  <!-- Head -->
  <ellipse cx="256" cy="142" rx="124" ry="98" fill="#4fb548"/>
  <path d="M138 120 C 158 48 354 48 374 120 C 332 94 180 94 138 120 Z" fill="#3f9a3c"/>
  <!-- Eyes (large, like a real boomslang) -->
  <circle cx="200" cy="140" r="47" fill="#f6f2c8"/>
  <circle cx="312" cy="140" r="47" fill="#f6f2c8"/>
  <circle cx="206" cy="146" r="28" fill="#2b2f36"/>
  <circle cx="306" cy="146" r="28" fill="#2b2f36"/>
  <circle cx="216" cy="133" r="9" fill="#ffffff"/>
  <circle cx="316" cy="133" r="9" fill="#ffffff"/>
  <!-- Nostrils and smile -->
  <circle cx="240" cy="199" r="5" fill="#2e6e2c"/>
  <circle cx="272" cy="199" r="5" fill="#2e6e2c"/>
  <path d="M224 214 Q 256 230 288 214" fill="none" stroke="#2e6e2c" stroke-width="7" stroke-linecap="round"/>
  <!-- Tongue -->
  <path d="M256 224 L 256 262 M256 258 L 243 275 M256 258 L 269 275" fill="none" stroke="#e0533f" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
