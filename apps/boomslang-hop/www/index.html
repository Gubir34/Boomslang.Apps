<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0d1f14">
<title>Boomslang Hop</title>
<link rel="icon" href="logo.svg">
<style>
  html, body { margin:0; height:100%; background:#0d1f14; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100vw; height:100vh; }
  #hud { position:fixed; top:10px; right:12px; display:flex; gap:8px; }
  #hud button { background:rgba(0,0,0,.35); color:#e8f5e9; border:1px solid rgba(255,255,255,.2); border-radius:8px; font:14px system-ui; padding:6px 10px; cursor:pointer; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><button id="mute" title="Music on/off (M)">♪ On</button><button id="pause" title="Pause (P)">❚❚</button></div>
<script>
// Boomslang Hop - an original one-button runner for the Boomslang mascot.
// Jump with Space, Up, W, a click or a tap; jump again in the air for a double jump.
(() => {
const cv = document.getElementById('c'), g = cv.getContext('2d');
let W = 0, H = 0, S = 1, GROUND = 0;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
  S = Math.min(W / 900, H / 520); if (S < 0.55) S = 0.55;
  GROUND = H * 0.78;
}
addEventListener('resize', resize); resize();

// ---------- audio ----------
let ac = null, muted = localStorage.getItem('bh-muted') === '1', nextBeat = 0, beat = 0;
function audio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (ac && ac.state === 'suspended') ac.resume();
}
function tone(freq, start, dur, type = 'square', vol = 0.05, slide = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), v = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, start);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq * slide), start + dur);
  v.gain.setValueAtTime(vol, start); v.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  o.connect(v).connect(ac.destination); o.start(start); o.stop(start + dur + 0.02);
}
function noise(start, dur, vol) {
  if (!ac) return;
  const b = ac.createBuffer(1, ac.sampleRate * dur, ac.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), v = ac.createGain();
  f.type = 'highpass'; f.frequency.value = 6000; s.buffer = b;
  v.gain.setValueAtTime(vol, start); v.gain.exponentialRampToValueAtTime(0.0001, start + dur);
  s.connect(f).connect(v).connect(ac.destination); s.start(start);
}
// A small original groove in A minor pentatonic
const BASS = [45, 0, 45, 48, 0, 50, 0, 52, 45, 0, 45, 55, 0, 52, 50, 48];
const LEAD = [69, 0, 72, 0, 74, 0, 76, 74, 72, 0, 69, 0, 67, 0, 69, 0, 76, 0, 79, 76, 74, 0, 72, 0, 74, 72, 69, 0, 67, 0, 0, 0];
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function music(speedFactor) {
  if (!ac || muted || state !== 'run') return;
  const step = 60 / (112 + 28 * speedFactor) / 2;
  if (nextBeat < ac.currentTime) nextBeat = ac.currentTime + 0.05;
  while (nextBeat < ac.currentTime + 0.12) {
    const i = beat % 16;
    if (BASS[i]) tone(midi(BASS[i]), nextBeat, step * 0.9, 'triangle', 0.09);
    if (i % 4 === 0) tone(70, nextBeat, 0.12, 'sine', 0.18, 0.5);
    if (i % 2 === 1) noise(nextBeat, 0.03, 0.04);
    const l = LEAD[beat % 32]; if (l && beat >= 32) tone(midi(l), nextBeat, step * 0.8, 'square', 0.025);
    nextBeat += step; beat++;
  }
}
const sfx = {
  jump() { if (ac && !muted) tone(520, ac.currentTime, 0.12, 'square', 0.04, 1.8); },
  double() { if (ac && !muted) tone(700, ac.currentTime, 0.12, 'square', 0.04, 1.6); },
  bug() { if (ac && !muted) { tone(988, ac.currentTime, 0.06, 'square', 0.04); tone(1319, ac.currentTime + 0.06, 0.1, 'square', 0.04); } },
  crash() { if (ac && !muted) { tone(220, ac.currentTime, 0.4, 'sawtooth', 0.06, 0.3); noise(ac.currentTime, 0.25, 0.08); } },
};

// ---------- game state ----------
let state = 'title', t = 0, speed = 0, dist = 0, score = 0, bugs = 0, best = +localStorage.getItem('bh-best') || 0, newBest = false;
let world = [], items = [], particles = [], trail = [], deadT = 0, flash = 0;
const snake = { x: 0, y: 0, vy: 0, jumps: 0, onGround: true, spin: 0 };
const GRAV = 2600, JUMP = 900, DJUMP = 780;

function reset() {
  t = 0; speed = 360; dist = 0; score = 0; bugs = 0; newBest = false; flash = 0;
  world = [{ x: -200, w: 1600 }]; items = []; particles = []; trail = [];
  snake.x = 160; snake.y = 0; snake.vy = 0; snake.jumps = 0; snake.onGround = true; snake.spin = 0;
  nextGen = 1400;
}
let nextGen = 0;

// Level generator: branch segments with gaps, obstacles and bugs, harder as speed rises
function generate() {
  const k = Math.min(1, (speed - 360) / 520);
  while (nextGen < dist + W / S + 400) {
    const r = Math.random();
    const gap = r < 0.22 + k * 0.18 ? 120 + Math.random() * (60 + k * 120) : 0;
    if (gap) { nextGen += gap; }
    const len = 500 + Math.random() * (700 - k * 250);
    world.push({ x: nextGen, w: len });
    let x = nextGen + 180;
    while (x < nextGen + len - 160) {
      const p = Math.random();
      if (p < 0.34) items.push({ kind: 'thorn', x, w: 44 + Math.random() * 30 * (0.5 + k) });
      else if (p < 0.50 + k * 0.08) items.push({ kind: 'hawk', x: x + 120, y: 120 + Math.random() * 70, phase: Math.random() * 6 });
      else if (p < 0.60 + k * 0.10) items.push({ kind: 'log', x, w: 70, h: 120 + k * 30 });
      else if (p < 0.85) for (let i = 0; i < 3; i++) items.push({ kind: 'bug', x: x + i * 46, y: 70 + Math.sin(i) * 20 + Math.random() * 60 });
      x += 320 + Math.random() * 380 - k * 120;
    }
    nextGen += len;
  }
  world = world.filter(s => s.x + s.w > dist - 400);
  items = items.filter(i => i.x > dist - 400 && !i.gone);
}

function groundAt(x) { return world.some(s => x >= s.x && x <= s.x + s.w); }

function jump() {
  audio();
  if (state === 'title' || (state === 'dead' && deadT > 0.6)) { reset(); state = 'run'; beat = 0; return; }
  if (state !== 'run') return;
  if (snake.onGround) { snake.vy = JUMP; snake.onGround = false; snake.jumps = 1; sfx.jump(); dust(6); }
  else if (snake.jumps < 2) { snake.vy = DJUMP; snake.jumps = 2; snake.spin = 1; sfx.double(); dust(4); }
}
function die() {
  if (state !== 'run') return;
  state = 'dead'; deadT = 0; flash = 1; sfx.crash();
  score = Math.floor(dist / 10) + bugs * 25;
  if (score > best) { best = score; newBest = true; localStorage.setItem('bh-best', best); }
  for (let i = 0; i < 24; i++) particles.push({ x: dist + snake.x, y: snake.y + 20, vx: (Math.random() - .5) * 500, vy: Math.random() * 600, life: 1, c: '#4fb548' });
}
function dust(n) { for (let i = 0; i < n; i++) particles.push({ x: dist + snake.x - 10, y: snake.y, vx: -Math.random() * 200, vy: Math.random() * 160, life: .6, c: '#9c6436' }); }

function update(dt) {
  t += dt;
  if (state === 'run') {
    speed = Math.min(880, 360 + t * 9);
    dist += speed * dt;
    generate();
    snake.vy -= GRAV * dt; snake.y += snake.vy * dt;
    if (snake.spin) snake.spin = Math.max(0, snake.spin - dt * 2.4);
    const wx = dist + snake.x;
    if (snake.y <= 0 && groundAt(wx)) { if (!snake.onGround && snake.vy < -300) dust(5); snake.y = 0; snake.vy = 0; snake.onGround = true; snake.jumps = 0; }
    else if (snake.y > 0 || !groundAt(wx)) snake.onGround = false;
    if (snake.y < -160) die();
    // collisions (head + front body)
    const hx = wx, hy = snake.y + 24;
    for (const it of items) {
      if (it.kind === 'thorn' && hx > it.x - 10 && hx < it.x + it.w + 10 && snake.y < 30) die();
      else if (it.kind === 'log' && hx > it.x - 14 && hx < it.x + it.w + 14 && snake.y < it.h - 6) die();
      else if (it.kind === 'hawk') { const y = it.y + Math.sin(t * 3 + it.phase) * 26; if (Math.abs(hx - it.x) < 40 && Math.abs(hy - y) < 34) die(); }
      else if (it.kind === 'bug' && !it.gone && Math.abs(hx - it.x) < 34 && Math.abs(hy - it.y) < 36) { it.gone = true; bugs++; sfx.bug(); for (let i = 0; i < 8; i++) particles.push({ x: it.x, y: it.y, vx: (Math.random() - .5) * 300, vy: (Math.random() - .3) * 300, life: .5, c: '#ffd34d' }); }
    }
    trail.unshift({ d: dist, y: snake.y }); if (trail.length > 90) trail.pop();
    score = Math.floor(dist / 10) + bugs * 25;
  } else if (state === 'dead') {
    deadT += dt; snake.vy -= GRAV * dt; snake.y += snake.vy * dt * 0.6; snake.spin += dt * 3;
  }
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 1400 * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  flash = Math.max(0, flash - dt * 3);
  music(Math.min(1, (speed - 360) / 520));
}

// ---------- drawing ----------
const X = wx => (wx - dist) * S, Y = wy => GROUND - wy * S;
function sky() {
  const gr = g.createLinearGradient(0, 0, 0, H);
  gr.addColorStop(0, '#12301e'); gr.addColorStop(1, '#0a1a10');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  // far canopy layers (parallax)
  for (const [f, col, hgt] of [[0.15, '#163a24', 0.42], [0.35, '#1b4a2c', 0.55]]) {
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 40; x += 40) {
      const wx = x / S + dist * f;
      g.lineTo(x, H * hgt + Math.sin(wx / 90) * 26 * S + Math.sin(wx / 37) * 12 * S);
    }
    g.lineTo(W, H); g.fill();
  }
  // hanging vines
  g.strokeStyle = 'rgba(79,181,72,.25)'; g.lineWidth = 3 * S;
  for (let i = 0; i < 8; i++) {
    const x = ((i * 260 - dist * 0.6) % (W / S + 260) + W / S + 260) % (W / S + 260) * S - 100;
    const len = (80 + (i * 53) % 120) * S;
    g.beginPath(); g.moveTo(x, 0); g.quadraticCurveTo(x + 18 * S, len / 2, x, len); g.stroke();
  }
}
function branch() {
  for (const s of world) {
    const x0 = X(s.x), x1 = X(s.x + s.w);
    if (x1 < -50 || x0 > W + 50) continue;
    g.fillStyle = '#6b3f1d'; g.beginPath();
    g.roundRect ? g.roundRect(x0, GROUND, x1 - x0, 26 * S, 13 * S) : g.rect(x0, GROUND, x1 - x0, 26 * S); g.fill();
    g.fillStyle = '#8d5a2e'; g.fillRect(x0 + 6 * S, GROUND + 4 * S, x1 - x0 - 12 * S, 6 * S);
    g.fillStyle = '#6fbf4a';
    for (let wx = Math.ceil(s.x / 140) * 140; wx < s.x + s.w - 30; wx += 140) {
      const lx = X(wx); g.beginPath(); g.ellipse(lx, GROUND - 4 * S, 16 * S, 7 * S, -0.5, 0, 6.3); g.fill();
    }
  }
}
function obstacles() {
  for (const it of items) {
    const x = X(it.x);
    if (x < -120 || x > W + 120) continue;
    if (it.kind === 'thorn') {
      g.fillStyle = '#7a8f2e'; g.strokeStyle = '#3d4a14'; g.lineWidth = 2 * S;
      g.beginPath(); g.ellipse(x + it.w * S / 2, GROUND - 2 * S, it.w * S / 2 + 6 * S, 20 * S, 0, Math.PI, 0); g.fill(); g.stroke();
      g.fillStyle = '#9aae3c'; g.beginPath(); g.ellipse(x + it.w * S / 2 - 6 * S, GROUND - 10 * S, it.w * S / 4, 7 * S, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#d9d0b0';
      for (let k = 0; k < it.w; k += 14) { const tx = x + (k + 7) * S; g.beginPath(); g.moveTo(tx - 5 * S, GROUND - 14 * S); g.lineTo(tx, GROUND - 30 * S); g.lineTo(tx + 5 * S, GROUND - 14 * S); g.fill(); }
    } else if (it.kind === 'log') {
      g.fillStyle = '#5a3418'; g.fillRect(x, Y(it.h), it.w * S, it.h * S);
      g.fillStyle = '#7a4a24'; for (let y = 20; y < it.h; y += 34) g.fillRect(x + 8 * S, Y(y + 6), it.w * S - 16 * S, 4 * S);
      g.fillStyle = '#c99b6a'; g.beginPath(); g.ellipse(x + it.w * S / 2, Y(it.h), it.w * S / 2, 9 * S, 0, 0, 6.3); g.fill();
      g.strokeStyle = '#8d5a2e'; g.lineWidth = 2 * S; g.beginPath(); g.ellipse(x + it.w * S / 2, Y(it.h), it.w * S / 4, 4 * S, 0, 0, 6.3); g.stroke();
    } else if (it.kind === 'hawk') {
      const y = Y(it.y + Math.sin(t * 3 + it.phase) * 26), flap = Math.sin(t * 14 + it.phase) * 14 * S;
      g.fillStyle = '#4a3a2c';
      g.beginPath(); g.moveTo(x - 34 * S, y - flap); g.quadraticCurveTo(x - 10 * S, y - 10 * S, x, y); g.quadraticCurveTo(x + 10 * S, y - 10 * S, x + 34 * S, y - flap); g.lineTo(x + 12 * S, y + 6 * S); g.lineTo(x - 12 * S, y + 6 * S); g.fill();
      g.fillStyle = '#6b5440'; g.beginPath(); g.ellipse(x, y + 4 * S, 14 * S, 9 * S, 0, 0, 6.3); g.fill();
      g.fillStyle = '#e9a23b'; g.beginPath(); g.moveTo(x - 14 * S, y + 2 * S); g.lineTo(x - 24 * S, y + 6 * S); g.lineTo(x - 14 * S, y + 8 * S); g.fill();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(x - 8 * S, y + 1 * S, 3 * S, 0, 6.3); g.fill();
    } else if (it.kind === 'bug' && !it.gone) {
      const y = Y(it.y + Math.sin(t * 5 + it.x) * 5);
      g.fillStyle = '#ffd34d'; g.beginPath(); g.ellipse(x, y, 11 * S, 8 * S, 0, 0, 6.3); g.fill();
      g.fillStyle = '#c4532d'; g.beginPath(); g.ellipse(x, y, 11 * S, 8 * S, 0, -1.57, 1.57); g.fill();
      g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 1.5 * S; g.beginPath(); g.moveTo(x, y - 8 * S); g.lineTo(x, y + 8 * S); g.stroke();
    }
  }
}
function drawSnake() {
  const hx = X(dist + snake.x), hy = Y(snake.y) - 24 * S;
  // body: follows where the head has been
  g.lineCap = 'round'; g.lineJoin = 'round';
  const pts = [];
  for (let i = 0; i < trail.length; i += 3) {
    const p = trail[i], px = hx - (dist - p.d) * S;
    if (px < hx - 170 * S) break;
    pts.push([px, Y(p.y) - 12 * S + Math.sin(i * 0.35 + t * 10) * 2 * S]);
  }
  if (state !== 'run' && pts.length < 2) for (let i = 0; i < 12; i++) pts.push([hx - i * 13 * S, hy + 12 * S + Math.sin(i * 0.8 + t * 3) * 4 * S]);
  if (pts.length > 1) {
    g.strokeStyle = '#3f9a3c'; g.lineWidth = 20 * S; g.beginPath(); g.moveTo(...pts[0]); for (const p of pts) g.lineTo(...p); g.stroke();
    g.strokeStyle = '#c9ea7f'; g.lineWidth = 6 * S; g.setLineDash([10 * S, 6 * S]); g.beginPath(); g.moveTo(...pts[0]); for (const p of pts) g.lineTo(...p); g.stroke(); g.setLineDash([]);
  }
  // head
  g.save(); g.translate(hx, hy); g.rotate(snake.spin * Math.PI * 2 * (state === 'dead' ? 1 : -1));
  g.fillStyle = '#4fb548'; g.beginPath(); g.ellipse(0, 0, 26 * S, 21 * S, 0, 0, 6.3); g.fill();
  g.fillStyle = '#3f9a3c'; g.beginPath(); g.ellipse(0, -9 * S, 22 * S, 10 * S, 0, Math.PI, 0); g.fill();
  const dead = state === 'dead';
  for (const ex of [-9, 11]) {
    g.fillStyle = '#f6f2c8'; g.beginPath(); g.arc(ex * S, -2 * S, 9 * S, 0, 6.3); g.fill();
    if (dead) { g.strokeStyle = '#2b2f36'; g.lineWidth = 2.5 * S; g.beginPath(); g.moveTo((ex - 4) * S, -6 * S); g.lineTo((ex + 4) * S, 2 * S); g.moveTo((ex + 4) * S, -6 * S); g.lineTo((ex - 4) * S, 2 * S); g.stroke(); }
    else { g.fillStyle = '#2b2f36'; g.beginPath(); g.arc((ex + 2) * S, -1 * S, 5 * S, 0, 6.3); g.fill(); g.fillStyle = '#fff'; g.beginPath(); g.arc((ex + 3.5) * S, -3 * S, 1.8 * S, 0, 6.3); g.fill(); }
  }
  if (!dead && Math.sin(t * 6) > 0.3) { g.strokeStyle = '#e0533f'; g.lineWidth = 2.5 * S; g.beginPath(); g.moveTo(24 * S, 8 * S); g.lineTo(36 * S, 8 * S); g.lineTo(41 * S, 4 * S); g.moveTo(36 * S, 8 * S); g.lineTo(41 * S, 12 * S); g.stroke(); }
  g.restore();
}
function particlesDraw() {
  for (const p of particles) { g.globalAlpha = Math.max(0, p.life); g.fillStyle = p.c; g.fillRect(X(p.x) - 3 * S, Y(p.y) - 3 * S, 6 * S, 6 * S); }
  g.globalAlpha = 1;
}
function text(s, x, y, size, color = '#e8f5e9', align = 'center', weight = 700) {
  g.font = `${weight} ${size}px system-ui, -apple-system, Segoe UI, sans-serif`; g.textAlign = align;
  g.fillStyle = 'rgba(0,0,0,.35)'; g.fillText(s, x + 2, y + 2); g.fillStyle = color; g.fillText(s, x, y);
}
function hud() {
  text(String(score), 18, 40, 30 * Math.max(S, .8), '#e8f5e9', 'left');
  text(`Best ${best}`, 18, 64, 15 * Math.max(S, .8), '#9fd59b', 'left', 500);
  if (bugs) text(`🪲 ${bugs}`, 18, 88, 15 * Math.max(S, .8), '#ffd34d', 'left', 600);
}
function overlay() {
  const c = W / 2, m = H * 0.32, z = Math.max(S, .8);
  if (state === 'title') {
    text('Boomslang Hop', c, m, 52 * z, '#c9ea7f');
    text('Tap, click or press Space to jump. Jump again in the air.', c, m + 44 * z, 18 * z, '#e8f5e9', 'center', 500);
    text('Hop over thorns, double jump fallen logs, dodge the hawks', c, m + 72 * z, 16 * z, '#9fd59b', 'center', 500);
    text('and snack on beetles for 25 points each.', c, m + 94 * z, 16 * z, '#9fd59b', 'center', 500);
    if (Math.sin(t * 4) > -0.3) text('Tap to start', c, m + 150 * z, 24 * z, '#ffd34d');
  } else if (state === 'dead') {
    text(newBest ? 'New best!' : 'Oops!', c, m, 48 * z, newBest ? '#ffd34d' : '#c9ea7f');
    text(`Score ${score}  ·  Best ${best}`, c, m + 42 * z, 22 * z);
    if (deadT > 0.6 && Math.sin(t * 4) > -0.3) text('Tap to try again', c, m + 96 * z, 22 * z, '#ffd34d');
  } else if (state === 'pause') {
    text('Paused', c, m, 44 * z); text('Press P or tap to continue', c, m + 40 * z, 18 * z, '#9fd59b', 'center', 500);
  }
}
function frame() {
  sky(); branch(); obstacles(); drawSnake(); particlesDraw(); hud(); overlay();
  if (flash) { g.fillStyle = `rgba(229,72,77,${flash * 0.35})`; g.fillRect(0, 0, W, H); }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  if (state !== 'pause') update(dt);
  frame();
  requestAnimationFrame(loop);
}
reset(); state = 'title';
requestAnimationFrame(loop);

// ---------- input ----------
function togglePause() {
  if (state === 'run') state = 'pause'; else if (state === 'pause') { state = 'run'; last = performance.now(); }
  document.getElementById('pause').textContent = state === 'pause' ? '▶' : '❚❚';
}
function toggleMute() {
  muted = !muted; localStorage.setItem('bh-muted', muted ? '1' : '0');
  document.getElementById('mute').textContent = muted ? '♪ Off' : '♪ On';
}
document.getElementById('mute').textContent = muted ? '♪ Off' : '♪ On';
addEventListener('keydown', e => {
  if (e.repeat) return;
  if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) { e.preventDefault(); state === 'pause' ? togglePause() : jump(); }
  else if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') togglePause();
  else if (e.key === 'm' || e.key === 'M') toggleMute();
});
cv.addEventListener('pointerdown', e => { e.preventDefault(); state === 'pause' ? togglePause() : jump(); });
document.getElementById('pause').onclick = togglePause;
document.getElementById('mute').onclick = toggleMute;
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'run') togglePause(); });
window.__bh = { get state() { return state; }, get score() { return score; }, get dist() { return dist; }, get speed() { return speed; }, get snake() { return snake; }, get items() { return items; }, get world() { return world; }, jump };
})();
</script>
</body>
</html>
