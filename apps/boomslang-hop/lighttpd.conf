server.port = __PORT__
server.bind = "0.0.0.0"
server.document-root = "./www"
server.max-connections = 16
server.upload-dirs = ( "/useremain/tmp" )
index-file.names = ( "index.html" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".js" => "text/javascript",
  ".css" => "text/css",
  ".svg" => "image/svg+xml",
  ".png" => "image/png"
)
