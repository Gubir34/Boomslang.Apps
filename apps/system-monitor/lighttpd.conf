server.port = __PORT__
server.bind = "0.0.0.0"
server.document-root = "./www"
server.modules = ( "mod_alias", "mod_setenv" )
server.stream-response-body = 2
server.max-connections = 16
server.upload-dirs = ( "/useremain/tmp" )
index-file.names = ( "index.html" )

alias.url = ( "/data/" => "__DATA_DIR__/" )

mimetype.assign = (
  ".html" => "text/html; charset=utf-8",
  ".js" => "text/javascript",
  ".css" => "text/css",
  ".svg" => "image/svg+xml",
  ".png" => "image/png",
  ".json" => "application/json",
  ".csv" => "text/csv"
)

$HTTP["url"] =~ "^/data/" {
  setenv.add-response-header = ( "Cache-Control" => "no-store" )
}
